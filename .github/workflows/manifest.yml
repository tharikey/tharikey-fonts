name: font manifest

# The catalog ships independently of the website: every push validates the fragments, and main compiles
# the manifest + uploads it (and the hosted OFL files) straight to Cloudflare R2 behind fonts.tharikey.com.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Validate fragments against the schema
        run: python3 tools/build_manifest.py --check

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Compile manifest
        run: python3 tools/build_manifest.py --base-url "https://fonts.tharikey.com"
      # Push the manifest + hosted OFL files to the R2 bucket served at fonts.tharikey.com.
      # Uses the S3-compatible API; secrets configured in the repo settings.
      #   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ACCOUNT_ID / R2_BUCKET
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_DEFAULT_REGION: auto          # R2 requires a region; "auto" is correct.
          # aws-cli v2 (>=2.23) enables data-integrity checksums that R2 rejects ("STREAMING-…-TRAILER").
          # Force them off so PUTs succeed against R2.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          ct() { case "${1##*.}" in
            ttf) echo font/ttf;; otf) echo font/otf;; woff2) echo font/woff2;;
            zip) echo application/zip;; svg) echo image/svg+xml;; png) echo image/png;;
            json) echo application/json;; txt) echo text/plain;; *) echo application/octet-stream;;
          esac; }
          # Manifest (both pretty + minified; consumers fetch the .min). Short cache so new releases land promptly.
          for f in manifest.json manifest.min.json; do
            aws s3 cp "dist/$f" "s3://$R2_BUCKET/$f" --endpoint-url "$R2_ENDPOINT" \
              --content-type application/json --cache-control "public, max-age=300, must-revalidate"
          done
          # Each foundry's assets/ (fonts, logo, license text) → s3://bucket/<foundry>/<file>.
          # Long cache — asset filenames are stable. No-op until any assets are vendored.
          find foundries -path '*/assets/*' -type f | while read -r f; do
            rel="${f#foundries/}"; key="${rel/\/assets\//\/}"   # <foundry>/<file>
            aws s3 cp "$f" "s3://$R2_BUCKET/$key" --endpoint-url "$R2_ENDPOINT" \
              --content-type "$(ct "$f")" --cache-control "public, max-age=31536000, immutable"
          done
